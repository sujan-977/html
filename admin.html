<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Bookings - Atithi Restro &amp; Lodge</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5A623;--blue:#1256A8;--dark:#07111F;--cream:#FDFAF4;--text:#12192b;--muted:#7a8498;--line:rgba(18,86,168,.14);--ok:#168a4a;--warn:#b66a00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Jost",sans-serif;background:var(--cream);color:var(--text)}
header{background:var(--dark);color:#fff;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.brand h1{font-family:"Cormorant Garamond",serif;font-size:clamp(28px,4vw,42px);line-height:1}
.brand p{color:rgba(255,255,255,.55);font-size:14px;margin-top:6px}
.back{color:var(--gold);text-decoration:none;font-weight:600}
main{padding:28px 5% 56px}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:12px;margin-bottom:20px;align-items:center}
input,select,button{font:inherit}
.control{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;min-height:44px}
.btn{border:none;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--line)}
.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
.stat strong{display:block;font-size:24px;color:var(--blue)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.06);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#f7f9fd}
td{font-size:14px}
.muted{color:var(--muted);font-size:12px}
.pill{display:inline-flex;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:#fff6df;color:var(--warn)}
.pill.confirmed{background:#eaf8f0;color:var(--ok)}
.empty{padding:42px;text-align:center;color:var(--muted)}
.admin-key{display:flex;gap:8px}
.admin-key input{width:190px}
@media(max-width:800px){.toolbar{grid-template-columns:1fr}.statusbar{grid-template-columns:1fr 1fr}.admin-key{display:grid}.admin-key input{width:100%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Bookings Admin</h1>
    <p id="live-state">Local view ready. Connect to the server for real-time SMTP bookings.</p>
  </div>
  <a class="back" href="index.html">Back to website</a>
</header>
<main>
  <div class="toolbar">
    <input class="control" id="search" placeholder="Search name, phone, email, branch..." oninput="render()">
    <select class="control" id="status-filter" onchange="render()">
      <option value="">All statuses</option>
      <option>Pending</option>
      <option>Confirmed</option>
    </select>
    <div class="admin-key">
      <input class="control" id="admin-key" placeholder="Admin key">
      <button class="btn" onclick="connectServer()">Connect Live</button>
      <button class="btn secondary" onclick="clearLocal()">Clear Local</button>
    </div>
  </div>

  <div class="statusbar">
    <div class="stat"><strong id="total-count">0</strong><span>Total Bookings</span></div>
    <div class="stat"><strong id="pending-count">0</strong><span>Pending</span></div>
    <div class="stat"><strong id="today-count">0</strong><span>Today</span></div>
    <div class="stat"><strong id="branch-count">0</strong><span>Branches Active</span></div>
  </div>

  <section class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Booking</th><th>Customer</th><th>Stay</th><th>Room</th><th>Food</th><th>Payment</th><th>Status</th><th>Received</th>
          </tr>
        </thead>
        <tbody id="booking-body"></tbody>
      </table>
    </div>
    <div class="empty" id="empty">No bookings yet.</div>
  </section>
</main>

<script>
let bookings = JSON.parse(localStorage.getItem("atithi_bookings") || "[]");
let stream = null;

function apiBase() {
  return window.location.protocol === "file:" ? "http://localhost:3000" : "";
}

function saveLocal() {
  localStorage.setItem("atithi_bookings", JSON.stringify(bookings));
}

function fmt(value) {
  if (!value) return "-";
  return new Date(value).toLocaleString();
}

function normalize(booking) {
  return {
    id: booking.id || "BK" + Date.now(),
    name: booking.name || "",
    phone: booking.phone || "",
    email: booking.email || "",
    branch: booking.branch || "",
    checkin: booking.checkin || "",
    checkout: booking.checkout || "",
    room: booking.room || "",
    guests: booking.guests || "",
    food: booking.food || "",
    payment: booking.payment || "TBD",
    status: booking.status || "Pending",
    created: booking.created || new Date().toISOString()
  };
}

function upsert(booking) {
  const clean = normalize(booking);
  const index = bookings.findIndex(item => item.id === clean.id);
  if (index >= 0) bookings[index] = clean;
  else bookings.unshift(clean);
  bookings.sort((a,b) => new Date(b.created) - new Date(a.created));
  saveLocal();
  render();
}

function filtered() {
  const q = document.getElementById("search").value.toLowerCase();
  const status = document.getElementById("status-filter").value;
  return bookings.filter(b => {
    const text = [b.id,b.name,b.phone,b.email,b.branch,b.room,b.food,b.payment].join(" ").toLowerCase();
    return (!q || text.includes(q)) && (!status || b.status === status);
  });
}

function render() {
  const rows = filtered();
  const today = new Date().toISOString().slice(0,10);
  document.getElementById("total-count").textContent = bookings.length;
  document.getElementById("pending-count").textContent = bookings.filter(b => b.status === "Pending").length;
  document.getElementById("today-count").textContent = bookings.filter(b => (b.created || "").slice(0,10) === today).length;
  document.getElementById("branch-count").textContent = new Set(bookings.map(b => b.branch).filter(Boolean)).size;
  document.getElementById("empty").style.display = rows.length ? "none" : "block";
  document.getElementById("booking-body").innerHTML = rows.map(b => `
    <tr>
      <td><strong>${b.id}</strong><div class="muted">${b.branch || "-"}</div></td>
      <td><strong>${b.name || "-"}</strong><div>${b.phone || "-"}</div><div class="muted">${b.email || "-"}</div></td>
      <td>${b.checkin || "-"} to ${b.checkout || "-"}<div class="muted">${b.guests || "-"}</div></td>
      <td>${b.room || "-"}</td>
      <td>${b.food || "None"}</td>
      <td>${b.payment || "TBD"}</td>
      <td><span class="pill ${b.status === "Confirmed" ? "confirmed" : ""}">${b.status}</span></td>
      <td>${fmt(b.created)}</td>
    </tr>
  `).join("");
}

async function connectServer() {
  const key = document.getElementById("admin-key").value.trim();
  if (!key) { alert("Enter ADMIN_KEY from your server .env file."); return; }
  try {
    const res = await fetch(apiBase() + "/api/bookings", {headers: {"X-Admin-Key": key}});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not load bookings");
    bookings = data.bookings.map(normalize);
    saveLocal();
    render();
    if (stream) stream.close();
    stream = new EventSource(apiBase() + "/api/bookings/stream?adminKey=" + encodeURIComponent(key));
    stream.onopen = () => document.getElementById("live-state").textContent = "Connected live. New bookings will appear automatically.";
    stream.onmessage = event => upsert(JSON.parse(event.data));
    stream.onerror = () => document.getElementById("live-state").textContent = "Live connection paused. Check server and admin key.";
  } catch (err) {
    alert(err.message);
  }
}

function clearLocal() {
  if (!confirm("Clear only the bookings stored in this browser?")) return;
  bookings = [];
  saveLocal();
  render();
}

window.addEventListener("storage", event => {
  if (event.key === "atithi_bookings") {
    bookings = JSON.parse(event.newValue || "[]").map(normalize);
    render();
  }
});

bookings = bookings.map(normalize);
render();
</script>
</body>
</html>
